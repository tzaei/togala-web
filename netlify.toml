# Netlify build configuration.
#
# Without the Next.js plugin Netlify treats the output as a plain static folder,
# finds no index.html at the publish root, and 404s every route — including
# /robots.txt. The plugin wires up Next's routing and, importantly, runs the
# /api/contact route as a function; a static deploy cannot serve it at all.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Next.js 16 requires a modern Node; pin it so builds don't drift.
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Unlisted brand guidelines page.
#
# The brand kit is its own project (Tzaei Designs/Websites/togala-brand) and
# deploys to Vercel. It is proxied in here rather than vendored: the artwork is
# 88 MB, two thirds of which is download bundles that are themselves derived
# from the other files, and it is generated by a build script in that project.
# Proxying keeps it out of this repo and lets it ship on its own — regenerating
# the kit and deploying it there updates this page with no deploy here.
#
# The slug is random and the page sends `noindex, nofollow`, so it will not be
# linked or indexed. That is obscurity, not access control: anyone who has the
# URL can open it. If it ever needs to be genuinely private it wants a password,
# not a longer slug.
#
# The trailing-slash redirect is load-bearing. The kit's asset paths are all
# relative, so served at `/<slug>` (no slash) every `brand/...` reference would
# resolve against the site root and 404. `force = true` on both rules is what
# gets them ahead of the Next.js catch-all the Netlify plugin installs.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/brand-guidelines-e8e7d9b1a9ea47e8"
  to = "/brand-guidelines-e8e7d9b1a9ea47e8/"
  status = 301
  force = true

[[redirects]]
  from = "/brand-guidelines-e8e7d9b1a9ea47e8/*"
  to = "https://togala-brand.vercel.app/:splat"
  status = 200
  force = true
